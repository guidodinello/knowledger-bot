repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: debug-statements
        language_version: python3.13
      - id: check-added-large-files
      - id: name-tests-test
        args: [--pytest-test-first]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py313-plus]
        files: ^(knowledger|scripts|cli\.py|main\.py)

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
        files: ^(knowledger|scripts|cli\.py|main\.py)

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold, warning]
        files: ^Dockerfile
        stages: [pre-push]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: \.sh$
        stages: [pre-push]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: [--fix]
        stages: [pre-push]

  # ruff runs through the project's pinned ruff (pyproject dev group) rather than
  # ruff-pre-commit, so the hook and CI cannot resolve different versions. Matches the
  # local-hook pattern already used below for pyright/bandit/pytest. `types: [python]`
  # keeps this off Markdown: ruff also formats Python snippets in .md, and docs/bugs/*.md
  # deliberately holds misformatted "before" code.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        args: [--config, pyproject.toml, knowledger/, cli.py, main.py, scripts/]
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: bandit
        name: bandit
        entry: uv run bandit -r knowledger cli.py main.py scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
