[project]
name = "knowledger"
version = "0.1.0"
description = "Telegram bot that saves YouTube transcripts to Claude project knowledge bases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.8",
    "youtube-transcript-api>=1.0.0",
    "curl-cffi>=0.16.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pyright>=1.1.390",
    "bandit>=1.8.0",
    "vulture>=2.14",
    "pip-audit>=2.7.3",
    # Pinned exactly, and the pre-commit hook runs this same binary via `uv run` rather
    # than a separately versioned ruff-pre-commit rev. A floor (`>=`) plus an independent
    # hook rev is what let the hook format with one ruff while CI checked with another;
    # one pin consumed by both removes the drift instead of documenting it.
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["knowledger"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# A custom "exclude" replaces pyright's default excludes (node_modules, __pycache__,
# dot-directories) entirely rather than adding to them — so "include" is scoped to the
# real project paths instead, keeping .venv/.git/.claude out of scope implicitly.
include = ["knowledger", "cli.py", "main.py", "scripts", "tests"]
# scripts/transcribe.py depends on faster-whisper/ctranslate2, installed only in the
# separate .venv-transcribe (see its docstring) — not in the main venv pyright checks against.
exclude = ["scripts/transcribe.py"]

[tool.vulture]
paths = ["knowledger", "cli.py", "main.py", "scripts"]
min_confidence = 80
