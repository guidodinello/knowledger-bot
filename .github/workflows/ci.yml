name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. Restricting this to `branches: [main]`
  # silently skips CI on any PR targeting something else — a stacked PR based on
  # another feature branch gets zero verification, then inherits a green tick when
  # GitHub retargets it to main on the parent's merge. Every PR should be checked
  # regardless of where it is aimed; `push` stays scoped to main so branch pushes
  # do not duplicate each PR run.
  pull_request:
  workflow_dispatch:

# Default for every job below that doesn't override it — none of the lint/
# typecheck/test/security/image-build jobs write anything. `changes` keeps
# its own (contents: read + pull-requests: read for paths-filter).
permissions:
  contents: read

jobs:
  # ── Path change detection ──────────────────────────────────────────────────
  # Only the file-type linters are gated on this. The Python jobs always run:
  # the suite finishes in under a second and this is a single flat package, so
  # path-filtering it would cost more in machinery than it saves.
  #
  # Filtering is done with job-level `if:`, never a workflow-level `paths:`.
  # A skipped job reports "success" and satisfies a required status check, but a
  # workflow that never triggers reports no status at all and deadlocks the merge.
  changes:
    name: Detect changes
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      dockerfile_paths_files: ${{ steps.filter.outputs.dockerfile_paths_files }}
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_paths_files: ${{ steps.filter.outputs.markdown_paths_files }}
      shell: ${{ steps.filter.outputs.shell }}
      shell_paths_files: ${{ steps.filter.outputs.shell_paths_files }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          # Each filter includes this workflow file so a CI change re-runs
          # everything it affects instead of being invisible to filtering.
          filters: |
            dockerfiles:
              - 'Dockerfile*'
              - '.github/workflows/ci.yml'
            dockerfile_paths:
              - 'Dockerfile*'
            markdown:
              - '**/*.md'
              - '.github/workflows/ci.yml'
            markdown_paths:
              - '**/*.md'
            shell:
              - '**/*.sh'
              - '.github/workflows/ci.yml'
            shell_paths:
              - '**/*.sh'
            workflows:
              - '.github/workflows/**'

  # ── Lint ───────────────────────────────────────────────────────────────────
  lint-python:
    name: Lint Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --dev

      # Scoped to the Python tree rather than `.` on purpose: ruff also formats
      # Python snippets embedded in Markdown, and docs/bugs/*.md deliberately
      # contains misformatted "before" code that must not be normalized.
      - name: ruff format check
        run: uv run ruff format --check knowledger tests scripts cli.py main.py

      - name: ruff lint
        run: uv run ruff check knowledger tests scripts cli.py main.py

  # ── Type check ─────────────────────────────────────────────────────────────
  typecheck-python:
    name: Typecheck Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: pyright
        run: uv run pyright

  # ── Tests ──────────────────────────────────────────────────────────────────
  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest

  # ── Security scan ──────────────────────────────────────────────────────────
  security-python:
    name: Security Scan (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: bandit
        run: uv run bandit -r knowledger cli.py main.py scripts

      - name: vulture
        run: uv run vulture --config pyproject.toml knowledger/ cli.py main.py scripts/

      # --skip-editable drops the project's own editable install, which has no
      # PyPI release to audit against and would otherwise abort the run.
      - name: pip-audit
        run: uv run pip-audit --local --skip-editable

  # ── Dockerfile lint ────────────────────────────────────────────────────────
  lint-dockerfile:
    name: Lint Dockerfile
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: hadolint
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.dockerfile_paths_files }}
        run: |
          changed_files="$CHANGED_FILES"
          if [ -z "$changed_files" ] || [ "$changed_files" = "[]" ]; then
            echo "No changed Dockerfiles to lint."
            exit 0
          fi

          mapfile -t files < <(
            jq -r '.[]' <<< "$changed_files" | while IFS= read -r file; do
              if [ -f "$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No existing changed Dockerfiles to lint."
            exit 0
          fi

          for file in "${files[@]}"; do
            docker run --rm -i hadolint/hadolint:v2.14.0 hadolint \
              --failure-threshold warning \
              - < "$file"
          done

  # ── Shell lint ─────────────────────────────────────────────────────────────
  lint-shell:
    name: Lint Shell
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.shell_paths_files }}
        run: |
          changed_files="$CHANGED_FILES"
          if [ -z "$changed_files" ] || [ "$changed_files" = "[]" ]; then
            echo "No changed shell scripts to lint."
            exit 0
          fi

          mapfile -t files < <(
            jq -r '.[]' <<< "$changed_files" | while IFS= read -r file; do
              if [ -f "$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No existing changed shell scripts to lint."
            exit 0
          fi

          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.11.0 "${files[@]}"

  # ── Workflow lint ──────────────────────────────────────────────────────────
  lint-workflows:
    name: Lint Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # ── Markdown lint ──────────────────────────────────────────────────────────
  lint-markdown:
    name: Lint Markdown
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: markdownlint
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.markdown_paths_files }}
        run: |
          changed_files="$CHANGED_FILES"
          if [ -z "$changed_files" ] || [ "$changed_files" = "[]" ]; then
            echo "No changed markdown files to lint."
            exit 0
          fi

          mapfile -t files < <(
            jq -r '.[]' <<< "$changed_files" | while IFS= read -r file; do
              if [ -f "$file" ]; then
                printf '%s\n' "$file"
              fi
            done
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No existing changed markdown files to lint."
            exit 0
          fi

          npx --yes markdownlint-cli@0.49.0 "${files[@]}" --ignore node_modules --ignore .venv --ignore .git

  # ── Image build + suite against the real runtime libc ──────────────────────
  # The gap this closes is the one #58 fell through: nothing else here builds the image, so
  # a runtime-only failure in the container passed every job and deployed. It matters more
  # now that Dependabot auto-merges patch/minor `docker` bumps — a base-image bump that
  # breaks the build or the app would otherwise merge green.
  #
  # Running the suite inside the image is also what keeps the Alpine base honest: the tests
  # execute against musl here, so ctypes-level code that only works on glibc fails in CI
  # instead of in production (#59).
  build-image:
    name: Build Image & Test Inside
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test -t knowledger:test .

      # Non-root: several tests assert PermissionError on mode-0000 files, and root ignores
      # file modes, so a root-run suite would report false passes. HOME is redirected
      # because /app and its venv are root-owned.
      - name: Run suite inside the image
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp knowledger:test \
            .venv/bin/python -m pytest tests/ -q -p no:cacheprovider

      - name: Build runtime image
        run: docker build -t knowledger:runtime .

      - name: Runtime image starts and is lean
        run: |
          docker run --rm --entrypoint sh knowledger:runtime -c \
            'uv run --no-sync python -c "import knowledger.bot, knowledger.poller, knowledger.persistence"'
          # Asserts the default build target is `runtime`, not `test`. If a stage is ever
          # appended after runtime in the Dockerfile, dev dependencies would silently ship
          # to production and this fails.
          if docker run --rm --entrypoint sh knowledger:runtime -c \
               '.venv/bin/python -c "import pytest"' 2>/dev/null; then
            echo "::error::runtime image contains pytest — default build target is not 'runtime'"
            exit 1
          fi
          echo "runtime image is free of dev dependencies"

  # ── Summary gate (the single required status check for branch rules) ───────
  # Requiring this one context instead of enumerating jobs means adding a job
  # never needs a matching ruleset edit. `if: always()` is mandatory: without it
  # the gate is *skipped* when a dependency fails, and a skipped check reads as
  # success to branch rules — the gate would silently stop gating.
  ci:
    name: CI
    needs:
      - changes
      - lint-python
      - typecheck-python
      - test-python
      - security-python
      - build-image
      - lint-dockerfile
      - lint-shell
      - lint-workflows
      - lint-markdown
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - name: Check results
        run: |
          results=(${{ join(needs.*.result, ' ') }})
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              exit 1
            fi
          done
